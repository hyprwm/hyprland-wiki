baseURL                = "https://wiki.hypr.land/"
title                  = "Hyprland Wiki"
enableRobotsTXT        = true
enableGitInfo          = true
defaultContentLanguage = "en"
enableInlineShortcodes = true
locale                 = 'en-us'
pluralizeListTitles    = false
disablePathToLower     = true

[security.http]
  urls = ['(?i)^https?://[a-z]', '! (?i)localhost']
  
[outputs]
home    = ["HTML"]
page    = ["HTML"]
section = ["HTML", "RSS"]

[module.imports]
path = "github.com/imfing/hextra"

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.renderHooks.link]
useEmbedded = "fallback"

[markup.highlight]
noClasses = false

[[menu.main]]
identifier = "wiki"
name       = "Wiki"
pageRef    = "/"
weight     = 1

[[menu.main]]
identifier = "home"
name       = "Home"
url        = "https://hypr.land/"
weight     = 2

[[menu.main]]
identifier = "showcase"
name       = "Showcase"
url        = "https://hypr.land/hall_of_fame"
weight     = 3

[[menu.main]]
identifier = "news"
name       = "News"
url        = "https://hypr.land/news"
weight     = 4

[[menu.main]]
name   = "Search"
weight = 5
[menu.main.params]
type = "search"


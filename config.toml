[params.navbar]
displayTitle = true
displayLogo  = true
width        = "full"

[params.navbar.logo]
path = "favicon.svg"
dark = "favicon-dark.svg"

[params.page]
width = "full"

[params.theme]
default       = "system"
displayToggle = true

[params.footer]
enable           = false
displayCopyright = true
displayPoweredBy = true
width            = "normal"

[params.search]
enable = true
type   = "flexsearch"

[params.search.flexsearch]
index = "content"

[params.editURL]
enable = true
base   = "https://github.com/hyprwm/hyprland-wiki/edit/main/content/"

[params.blog.list]
displayTags = true

[params.comments]
enable = false

[params.sponsors]
enable = true

# Images should be light variants
# The theme recolors them when needed
[[params.sponsors.list]]
name  = "37signals"
image = "https://hypr.land/imgs/sponsors/37signals.svg"
